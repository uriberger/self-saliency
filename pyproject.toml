[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "selfsal"
version = "1.0.0"
description = "Self-Saliency: self-grounded attention for visual reasoning"
requires-python = ">=3.10"
# Deliberately minimal. The heavy stack (torch, transformers, vllm, deepspeed) is
# pinned per environment under env/ -- four of them, with genuinely conflicting pins --
# and installing this package must never be able to move any of those.
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["selfsal*"]

[tool.pytest.ini_options]
# So `pytest` works from a checkout without an install. The environments that run the
# real work install this package editable; the CPU tests should not require that.
pythonpath = ["."]
testpaths = ["tests"]
